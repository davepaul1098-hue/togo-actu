<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Togo Actu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Togo Actu 🇹🇬</h1></header>
  <main>
    <section id="view-meteo" class="view"></section>
    <section id="view-actus" class="view hidden">
      <div id="news-list"></div>
    </section>
    <section id="view-favoris" class="view hidden">
      <div id="fav-list"></div>
    </section>
  </main>
  <nav id="tabs">
    <button data-view="meteo">☀️ Météo</button>
    <button data-view="actus">📰 Actus</button>
    <button data-view="favoris">⭐ Favoris</button>
  </nav>
  <script src="js/app.js"></script>
</body>
</html>
